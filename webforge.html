<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>WebForge</title>

    <link rel="stylesheet" href="webforge.css" />
  </head>

  <body>
    <header>
      <h1 id="webforgeTitle">🌐 WebForge</h1>

      <div class="searchBox">
        <input id="search" placeholder="🔍 Search..." />

        <button id="prevMatch">▲</button>

        <button id="nextMatch">▼</button>
      </div>

      <div class="toolbar">
        <button id="run">▶ Run</button>

        <button id="open">🌐 Open</button>

        <button id="clear">🗑 Clear</button>

        <button id="upload">📂 Upload</button>

        <button id="assetsBtn" class="hidden">📁 Assets</button>

        <input type="file" id="fileInput" accept="image/*" multiple hidden />
      </div>
    </header>

    <div id="tabs">
      <button class="tab active" data-tab="html">📄 HTML</button>

      <button class="tab" data-tab="css">🎨 CSS</button>

      <button class="tab" data-tab="js">⚡ JavaScript</button>
    </div>

    <main>
      <div id="editorPanel">
        <textarea id="editor"></textarea>
      </div>

      <div id="previewPanel">
        <iframe id="preview"></iframe>
      </div>
    </main>

    <footer>
      <span id="status"> Ready ✓ </span>
    </footer>

    <div id="assetsWindow" class="popup">
      <div class="popup-box">
        <div class="popup-header">
          <h2>📁 Assets</h2>

          <button id="closeAssets">&times;</button>
        </div>

        <div id="assetList"></div>
      </div>
    </div>

    <script src="editor.js"></script>
    <script src="webforge.js"></script>
  </body>
</html>
