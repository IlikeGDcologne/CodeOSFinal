<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>CodeOS Documentation</title>

    <link rel="stylesheet" href="documentation.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="sidebar">
      <h1>📚 CodeOS Docs</h1>

      <button
        id="homeButton"
        type="button"
        style="
          width: 100%;
          padding: 11px 14px;
          margin: 0 0 14px 0;

          border: 1px solid rgba(255, 255, 255, 0.1);

          border-radius: 12px;

          background: rgba(255, 255, 255, 0.06);

          color: white;

          cursor: pointer;
          font-weight: 700;
        "
      >
        🏠 Home
      </button>

      <input id="search" placeholder="Search commands..." />

      <div id="commandList"></div>
    </div>

    <div class="content">
      <div id="viewer">
        <h2>👋 Welcome!</h2>

        <p>Select a command from the left.</p>
      </div>
    </div>

    <script>
      document.getElementById("homeButton")?.addEventListener("click", () => {
        window.location.href = "index.html";
      });
    </script>

    <script src="documentation.js"></script>
  </body>
</html>
