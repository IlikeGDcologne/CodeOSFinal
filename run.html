<!doctype html>
<html>
  <head>
    <title>CodeOS Runner</title>

    <style>
      body {
        background: #111;
        color: white;
        font-family: Inter, sans-serif;
        padding: 30px;
      }

      #loading {
        position: static;

        transform: none;

        font-size: 100px;

        animation: dance 0.4s infinite alternate;

        user-select: none;
      }

      @keyframes dance {
        from {
          transform: rotate(-20deg) scale(1);
        }

        to {
          transform: rotate(20deg) scale(1.15);
        }
      }

      #output {
        font-size: 24px;

        display: none;
      }

      #loadingScreen {
        position: fixed;

        inset: 0;

        background: #111;

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: center;

        gap: 30px;

        z-index: 999;
      }

      #loading {
        font-size: 100px;

        animation: dance 0.4s infinite alternate;

        user-select: none;
      }

      #loadingText {
        margin: 0;

        font-size: 34px;
      }

      #loadingBar {
        width: 420px;

        height: 22px;

        background: #333;

        border-radius: 999px;

        overflow: hidden;

        border: 2px solid #666;
      }

      #loadingFill {
        width: 0%;

        height: 100%;

        background: lime;
      }

      #output {
        display: none;

        font-size: 24px;
      }
    </style>
  </head>

  <body>
    <!-- =========================================================
     ↩ RETURN TO WORKSPACE
========================================================= -->

    <button id="returnToWorkspaceBtn" title="Return to CodeOS Workspace">
      ↩ Workspace
    </button>

    <style>
      #returnToWorkspaceBtn {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 999999;

        padding: 10px 16px;

        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;

        background: rgba(20, 20, 30, 0.78);
        color: white;

        font-size: 14px;
        font-weight: 600;

        cursor: pointer;

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);

        transition:
          transform 0.18s ease,
          background 0.18s ease,
          box-shadow 0.18s ease;
      }

      #returnToWorkspaceBtn:hover {
        transform: translateY(-2px);
        background: rgba(45, 45, 60, 0.92);

        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.38);
      }

      #returnToWorkspaceBtn:active {
        transform: scale(0.96);
      }
    </style>
    <div id="loadingScreen">
      <div id="loading">👾</div>

      <h1 id="loadingText">👾 Booting CodeOS...</h1>

      <div id="loadingBar">
        <div id="loadingFill"></div>
      </div>
    </div>

    <div id="output"></div>

    <script>
      /* =========================================================
       ↩ RETURN TO CODEOS WORKSPACE
    ========================================================= */

      const returnToWorkspaceBtn = document.getElementById(
        "returnToWorkspaceBtn",
      );

      if (returnToWorkspaceBtn) {
        returnToWorkspaceBtn.addEventListener("click", () => {
          console.log("↩ Returning to CodeOS Workspace...");

          window.location.href = "workspace.html";
        });
      }
    </script>
    <script src="run2.js"></script>
  </body>
</html>
